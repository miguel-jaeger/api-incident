name: CI/CD - Pruebas y Deploy a Render

# El flujo se ejecuta cuando se sube un cambio a la rama main
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: debian-latest    

    steps:
      # 1. Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instala Java 21, que es la versión usada por el proyecto
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Ejecuta las pruebas. Si alguna falla, el deploy no continúa
      - name: Ejecutar pruebas
        working-directory: app
        run: mvn test

  deploy:
    runs-on: ubuntu-latest
    needs: test # Asegura que solo corra si las pruebas pasan

    steps:     
      # 4a. Paso 1 del deploy: Preparar o notificar el inicio del despliegue
      - name: Preparar despliegue
        run: echo "Iniciando proceso de despliegue hacia Render..."

      # 4b. Paso 2 del deploy: Llamar al deploy hook de Render usando el secret de GitHub
      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
