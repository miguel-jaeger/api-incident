name: CI/CD - Pruebas y Deploy a Render

# El flujo se ejecuta cuando se sube un cambio a la rama main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instala Java 21, que es la versión usada por el proyecto
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Ejecuta las pruebas. Si alguna falla, el deploy no continúa
      - name: Ejecutar pruebas
        working-directory: app
        run: mvn test

      # 4. Llama al deploy hook de Render usando el secret de GitHub
      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
