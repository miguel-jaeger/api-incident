name: Test and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Pruebas programadas: todos los lunes a las 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Make Maven wrapper executable
        working-directory: app
        run: chmod +x mvnw

      - name: Run tests
        working-directory: app
        run: ./mvnw test

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
