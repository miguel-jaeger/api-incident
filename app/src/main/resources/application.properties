spring.application.name=app
# Puerto de la aplicación
server.port=8080

# Configuración de la base de datos SQLite
spring.datasource.url=jdbc:sqlite:data/incident.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Desactivar la redirección automática del controlador interno de springdoc
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.disable-swagger-default-url=true

# Especificación OpenAPI en formato JSON
springdoc.api-docs.path=/v3/api-docs