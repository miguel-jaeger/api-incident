spring.application.name=app
# Puerto de la aplicación (configurable por variable PORT o 8081 por defecto)
server.port=${PORT:8081}

# Configuración de la base de datos SQLite
spring.datasource.url=jdbc:sqlite:data/incident.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar docs y swagger-ui
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
# Define /docs como la ruta oficial de Swagger UI
springdoc.swagger-ui.path=/docs
# Desactiva la URL default petstore
springdoc.swagger-ui.disable-swagger-default-url=true
